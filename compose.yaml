services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cipherdate
      POSTGRES_PASSWORD: cipherdate
      POSTGRES_DB: cipherdate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherdate -d cipherdate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
